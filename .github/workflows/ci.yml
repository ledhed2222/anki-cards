name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: mise run install
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test
      - run: mise run build
